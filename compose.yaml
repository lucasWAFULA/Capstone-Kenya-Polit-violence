services:
  dashboard:
    build: .
    ports:
      - '8000:8080'
    volumes:
      - severity-runtime:/app/runtime
    restart: unless-stopped
  ingestion:
    build: .
    command: ['python', 'scripts/ingestion_worker.py']
    env_file: .env
    volumes:
      - severity-runtime:/app/runtime
    restart: unless-stopped
    profiles: ['live']
volumes:
  severity-runtime:
